name: publish-skills

# Publishes skills + the agent manifest to the S3 buckets the in-cluster agent
# reads at boot. Auth is GitHub Actions OIDC — no static AWS keys.
#
# Two buckets, deliberately kept separate so the environments can move at
# different speeds:
#
#   dev   fianu-dev-skills  us-east-1  tracks main — dev agents pick up skills
#                                      as they land
#   prod  fianu-skills      us-east-2  shared bucket read by every other
#                                      environment; moves only on a v* tag
#
# So: a push to main publishes dev only; a v* tag publishes both. Both roles
# and buckets are provisioned in fianu-cloud (prod ones under
# environments/fianu-prod/aws, dev under environments/fianu-dev/aws).

on:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      # A dev-bucket failure must never block the prod publish, or vice versa.
      fail-fast: false
      matrix:
        include:
          - target: dev
            bucket: fianu-dev-skills
            region: us-east-1
            role: arn:aws:iam::844883297709:role/github-actions-skills-publisher-dev
          - target: prod
            bucket: fianu-skills
            region: us-east-2
            role: arn:aws:iam::844883297709:role/github-actions-skills-publisher

    env:
      # Single source of truth for the per-target gate. Job-level `if:` cannot
      # see the matrix context (it is evaluated before the matrix expands), so
      # the publishing steps carry it instead.
      SHOULD_PUBLISH: ${{ matrix.target == 'dev' || startsWith(github.ref, 'refs/tags/') }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Runs for every target, including skipped ones: validation is cheap and
      # a broken manifest should fail the build regardless of where it lands.
      - name: Validate skills + manifest
        run: sh scripts/validate-skills.sh

      - name: Resolve publish version
        id: ver
        run: |
          set -euo pipefail
          # Tags publish under their own name; main publishes under main/.
          # Either way the versioned prefix goes up first and latest/ only
          # advances afterwards, so a failed sync can never leave latest/ torn.
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "version=main" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure AWS credentials (OIDC)
        if: env.SHOULD_PUBLISH == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ matrix.role }}
          aws-region: ${{ matrix.region }}

      - name: Publish versioned prefix
        if: env.SHOULD_PUBLISH == 'true'
        env:
          BUCKET: ${{ matrix.bucket }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          aws s3 sync skills/ "s3://${BUCKET}/${VERSION}/skills/" --delete
          aws s3 cp manifests/agent-contexts.json "s3://${BUCKET}/${VERSION}/manifests/agent-contexts.json"

      - name: Advance latest/ (only after versioned publish succeeds)
        if: env.SHOULD_PUBLISH == 'true'
        env:
          BUCKET: ${{ matrix.bucket }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          aws s3 sync "s3://${BUCKET}/${VERSION}/skills/" "s3://${BUCKET}/latest/skills/" --delete
          aws s3 cp "s3://${BUCKET}/${VERSION}/manifests/agent-contexts.json" "s3://${BUCKET}/latest/manifests/agent-contexts.json"
