name: publish-skills

# Publishes skills + the agent manifest to the fianu-skills S3 bucket on a
# version tag. The in-cluster agent pulls these at boot (single source of
# truth). Auth is GitHub Actions OIDC — no static AWS keys.

on:
  push:
    tags:
      - "v*"

permissions:
  id-token: write
  contents: read

env:
  # Prod-owned shared bucket, consumed by every environment's agent. Dev keeps
  # its own fianu-dev-skills bucket and points at it via SKILLS_BUCKET on the
  # deployment side; this workflow only publishes the shared one.
  AWS_REGION: us-east-2
  SKILLS_BUCKET: fianu-skills
  # Must match the role provisioned in fianu-cloud (environments/fianu-prod/aws).
  PUBLISHER_ROLE_ARN: arn:aws:iam::844883297709:role/github-actions-skills-publisher

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate skills + manifest
        run: sh scripts/validate-skills.sh

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.PUBLISHER_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Publish versioned prefix
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          aws s3 sync skills/ "s3://${SKILLS_BUCKET}/${TAG}/skills/" --delete
          aws s3 cp manifests/agent-contexts.json "s3://${SKILLS_BUCKET}/${TAG}/manifests/agent-contexts.json"

      - name: Advance latest/ (only after versioned publish succeeds)
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          aws s3 sync "s3://${SKILLS_BUCKET}/${TAG}/skills/" "s3://${SKILLS_BUCKET}/latest/skills/" --delete
          aws s3 cp "s3://${SKILLS_BUCKET}/${TAG}/manifests/agent-contexts.json" "s3://${SKILLS_BUCKET}/latest/manifests/agent-contexts.json"
